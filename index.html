<!DOCTYPE html>
<html lang="es">
<head>
<!-- MIRANDA TE AYUDA · demo interactiva · index.html v1.2 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIRANDA TE AYUDA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="ICONS/icon-192.png">
<link rel="icon" href="ICONS/icon-192.png">
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#32404f;--mut:#6b7684;--line:#e4e0da;--pri:#456f90;--pri-d:#355a76;--acc:#c95f45;--ok:#2e7d4f;--bad:#b3412e;--blue:#3d6b94;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 100px}
header.top{position:sticky;top:0;z-index:5;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{height:40px;width:auto;flex:none;display:block}
.bt b{display:block;font-size:18px;font-weight:800;letter-spacing:.01em;line-height:1.05}
.bt i{display:block;font-style:normal;font-weight:400;font-size:14px;line-height:1.1}
.seg{display:flex;background:#eef1f5;border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.demo{background:#fff4d6;border:1px solid #f0d58a;color:#6b4e00;font-size:13px;padding:8px 12px;border-radius:10px;margin:12px 0 0}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 2px 6px}
h3{margin:0 0 8px;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.alert{border-color:var(--acc);box-shadow:0 0 0 3px rgba(201,95,69,.14)}
.card p{margin:6px 0}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row>.btn{flex:1}
.meta{font-size:13px;color:var(--mut)}
.u{color:var(--bad)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-blue{background:#e6eef5;color:var(--blue)}
.b-amber{background:#fbe6df;color:#a4432c}
.b-green{background:#e0f1e6;color:var(--ok)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;min-height:46px;cursor:pointer}
.btn:active{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.amber{background:var(--acc)}
.btn.red{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:14px}
.btn.block{display:block;width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1 1 140px}
.big{font-size:46px;font-weight:800;line-height:1;color:var(--pri)}
.meter{height:10px;background:#e8e4da;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.meter>i{display:block;height:100%;background:var(--pri);border-radius:99px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.kv div{background:#f7f5f0;border-radius:10px;padding:10px}
.kv b{display:block;font-size:20px}
.kv span{font-size:12px;color:var(--mut)}
.ph{display:flex;gap:8px;margin-top:8px}
.ph figure{margin:0;flex:1;min-width:0}
.ph img,.prev{width:100%;border-radius:10px;display:block}
.prev{max-height:200px;object-fit:cover;margin-top:8px}
.ph figcaption{font-size:12px;color:var(--mut);margin-top:2px}
.mats{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.mats li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.sign{background:#eef6f1;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;color:#235a3a}
.sign code{font-size:12px;word-break:break-all}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.opt .row{margin-bottom:4px}
.notice{background:#eef3f7;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
.okc{color:var(--ok);font-weight:700}
.warnc{color:#a4432c;font-weight:700}
.err{color:var(--bad);font-weight:700;min-height:1.2em;margin:4px 0}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=radio]{width:auto;margin-right:6px}
input[type=file]{padding:8px}
.radios label{font-weight:500;font-size:15px;margin:6px 0}
.mrow{display:flex;gap:8px;margin-bottom:6px}
.mrow .mn{flex:3}.mrow .mc{flex:1.2}
.modal{position:fixed;inset:0;background:rgba(20,28,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .row{margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#32404f;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{color:var(--mut);text-align:center;padding:14px}
footer{margin-top:26px;text-align:center;font-size:12px;color:var(--mut)}
footer button{background:none;border:0;color:var(--pri);font:inherit;text-decoration:underline;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;font:inherit;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav.tabs .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--pri)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--pri);border-radius:0 0 3px 3px}
.bdg{position:absolute;top:3px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px;text-align:center}
@media(min-width:700px){.wrap{padding-bottom:60px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
